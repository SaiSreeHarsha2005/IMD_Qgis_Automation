<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="cloudGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <!-- Main Puffy Cloud (White) -->
  <g filter="url(#shadowLight)">
    <path d="M 30 52 
             C 22 52, 14 45, 14 37 
             C 14 30, 19 24, 26 23 
             C 28 14, 37 8, 48 8 
             C 58 8, 67 14, 70 23 
             C 77 24, 84 30, 84 37 
             C 84 45, 77 52, 68 52 
             Z" 
          fill="url(#cloudGradLight)" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Internal Cloud Highlights -->
    <path d="M 28 35 C 24 35, 20 31, 22 26 C 25 21, 33 21, 36 25" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9" stroke-linecap="round"/>
    <path d="M 40 18 C 45 13, 53 13, 58 17" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" stroke-linecap="round"/>
  </g>
  <!-- Rain Drops (Light to Moderate Rain) -->
  <g fill="#38BDF8" stroke="#0284C7" stroke-width="0.75">
    <!-- Drop 1 -->
    <path d="M 28 58 C 28 58, 25 64, 25 66 C 25 68, 27 70, 29 70 C 31 70, 33 68, 33 66 C 33 64, 30 58, 30 58 Z"/>
    <!-- Drop 2 -->
    <path d="M 42 60 C 42 60, 39 66, 39 68 C 39 70, 41 72, 43 72 C 45 72, 47 70, 47 68 C 47 66, 44 60, 44 60 Z"/>
    <!-- Drop 3 -->
    <path d="M 56 58 C 56 58, 53 64, 53 66 C 53 68, 55 70, 57 70 C 59 70, 61 68, 61 66 C 61 64, 58 58, 58 58 Z"/>
    <!-- Drop 4 -->
    <path d="M 70 60 C 70 60, 67 66, 67 68 C 67 70, 69 72, 71 72 C 73 72, 75 70, 75 68 C 75 66, 72 60, 72 60 Z"/>
  </g>
</svg>
