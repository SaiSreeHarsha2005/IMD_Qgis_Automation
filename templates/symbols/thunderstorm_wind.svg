<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Convective Cloud (Dark Storm Cloud) -->
  <path d="M 22 52 
           A 16 16 0 0 1 34 26 
           A 22 22 0 0 1 70 20 
           A 18 18 0 0 1 92 36 
           A 14 14 0 0 1 88 56 
           A 12 12 0 0 1 78 58 
           L 24 58 
           A 12 12 0 0 1 22 52 Z" 
        fill="#262626" stroke="#0D0D0D" stroke-width="2.5" stroke-linejoin="round"/>
        
  <!-- Intense Yellow Lightning Bolt Dropping from Cloud Base -->
  <polygon points="44,52 32,70 42,70 34,92 56,66 45,66" 
           fill="#FFD700" stroke="#CC8800" stroke-width="1.8" stroke-linejoin="round"/>
           
  <!-- Windsock Mast on the Right/Bottom-Right -->
  <line x1="68" y1="42" x2="68" y2="94" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="68" cy="42" r="2.5" fill="#111111"/>
  
  <!-- Windsock Swivels -->
  <line x1="68" y1="46" x2="74" y2="48" stroke="#333333" stroke-width="2"/>
  <line x1="68" y1="60" x2="74" y2="58" stroke="#333333" stroke-width="2"/>
  
  <!-- Windsock Mouth -->
  <ellipse cx="74" cy="53" rx="2.5" ry="6.5" fill="#CC0000" stroke="#111111" stroke-width="1.5"/>
  
  <!-- Windsock Striped Cone -->
  <path d="M 74 46.5 L 84 49.5 L 84 57.5 L 74 60 Z" fill="#E60000" stroke="#111111" stroke-width="1.2"/>
  <path d="M 84 49.5 L 94 52.5 L 94 62 L 84 57.5 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
  <path d="M 94 52.5 L 104 55.5 L 104 66 L 94 62 Z" fill="#E60000" stroke="#111111" stroke-width="1.2"/>
  <path d="M 104 55.5 L 114 58.5 L 114 70 L 104 66 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/>
  <path d="M 114 58.5 L 118 60 L 118 71.5 L 114 70 Z" fill="#E60000" stroke="#111111" stroke-width="1.2"/>
</svg>
