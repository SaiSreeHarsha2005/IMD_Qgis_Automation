<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <filter id="shadowExt" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="cloudGradExt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="60%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <!-- Main Puffy Cloud (Pitch Black/Extreme) -->
  <g filter="url(#shadowExt)">
    <path d="M 30 52 
             C 22 52, 14 45, 14 37 
             C 14 30, 19 24, 26 23 
             C 28 14, 37 8, 48 8 
             C 58 8, 67 14, 70 23 
             C 77 24, 84 30, 84 37 
             C 84 45, 77 52, 68 52 
             Z" 
          fill="url(#cloudGradExt)" stroke="#000000" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Intense Edge Rim -->
    <path d="M 36 15 C 44 9, 54 9, 62 14" fill="none" stroke="#52525B" stroke-width="1.5" opacity="0.7" stroke-linecap="round"/>
  </g>
  <!-- Torrential Rain Drops (Dense Black / Deep Red Tint) -->
  <g fill="#000000" stroke="#000000" stroke-width="0.8">
    <path d="M 24 58 C 24 58, 21 64, 21 66 C 21 68, 23 70, 25 70 C 27 70, 29 68, 29 66 C 29 64, 26 58, 26 58 Z"/>
    <path d="M 36 60 C 36 60, 33 66, 33 68 C 33 70, 35 72, 37 72 C 39 72, 41 70, 41 68 C 41 66, 38 60, 38 60 Z"/>
    <path d="M 48 58 C 48 58, 45 64, 45 66 C 45 68, 47 70, 49 70 C 51 70, 53 68, 53 66 C 53 64, 50 58, 50 58 Z"/>
    <path d="M 60 60 C 60 60, 57 66, 57 68 C 57 70, 59 72, 61 72 C 63 72, 65 70, 65 68 C 65 66, 62 60, 62 60 Z"/>
    <path d="M 72 58 C 72 58, 69 64, 69 66 C 69 68, 71 70, 73 70 C 75 70, 77 68, 77 66 C 77 64, 74 58, 74 58 Z"/>
  </g>
</svg>
